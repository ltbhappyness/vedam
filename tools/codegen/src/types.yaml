package: vedam

status:
  - name: SUCCESS
    value: 0
    comment: The call completed and any output buffers are valid.
  - name: FAILURE
    value: -1
    comment: The call failed for a reason not covered by a more specific code. Discard outputs.
  - name: NOT_SUPPORTED
    value: -2
    comment: This build or origin does not support the verb or attribute. Discard outputs.
  - name: NO_MEMORY
    value: -3
    comment: A buffer could not be allocated. Retry later or use a smaller list.
  - name: INVALID_PARAMETER
    value: -4
    comment: A pointer, count, or length is not usable. Fix the arguments and retry.
  - name: ITEM_ALREADY_EXISTS
    value: -5
    comment: Create was asked for an object that already exists.
  - name: ITEM_NOT_FOUND
    value: -6
    comment: Read, set, or delete named an object that does not exist.
  - name: BUFFER_OVERFLOW
    value: -7
    comment: A caller-supplied buffer is too small. The needed length is written when the type allows it.
  - name: MANDATORY_ATTR_MISSING
    value: -8
    comment: Create lacked an attribute that must be present. Add it and retry.
  - name: UNINITIALIZED
    value: -9
    comment: vedam_init has not completed, or vedam_deinit has already run.
  - name: NOT_IMPLEMENTED
    value: -10
    comment: The verb exists in the header but this origin or slice must not call it.
  - name: FAILED_PRECONDITION
    value: -11
    comment: The object exists but is not in a state that allows this verb.
  - name: CAPABILITY_DENIED
    value: -12
    comment: The caller is not allowed to use this verb or attribute.
  - name: OFFLINE
    value: -13
    comment: The path needs a network or peer that is not reachable.
  - name: THERMAL_SHED
    value: -14
    comment: The device is too hot or too busy. Retry after a wait.
  - name: OBJECT_IN_USE
    value: -15
    comment: Delete or set cannot proceed while another call holds the object.
  - name: INVALID_ATTR_VALUE_0
    value: -100
    comment: An attribute value is not valid. Add the zero-based index of that attribute in the list to this code.
  - name: ATTR_NOT_IMPLEMENTED_0
    value: -200
    comment: An attribute id is known but not implemented. Add the zero-based index of that attribute in the list to this code.
  - name: UNKNOWN_ATTRIBUTE_0
    value: -300
    comment: An attribute id is not defined for this class. Add the zero-based index of that attribute in the list to this code.
  - name: ATTR_NOT_SUPPORTED_0
    value: -400
    comment: The origin may not use this attribute on this verb. Add the zero-based index of that attribute in the list to this code.
  - name: INVALID_ATTR_ID_0
    value: -500
    comment: An attribute id is out of range. Add the zero-based index of that attribute in the list to this code.

classes:
  - name: SYSTEM
    id: 1
    comment: The process system object.
  - name: IDENTITY
    id: 2
    comment: Identity objects keyed by the caller object id.
  - name: STORAGE
    id: 3
    comment: Storage objects keyed by the caller object id.
  - name: SECURITY
    id: 4
    comment: The process security singleton.
  - name: WASM
    id: 5
    comment: The process WebAssembly configuration singleton.

proto_status:
  - UNSPECIFIED
  - OK
  - FAILURE
  - NOT_SUPPORTED
  - NO_MEMORY
  - INVALID_PARAMETER
  - ITEM_ALREADY_EXISTS
  - ITEM_NOT_FOUND
  - BUFFER_OVERFLOW
  - MANDATORY_ATTR_MISSING
  - UNINITIALIZED
  - NOT_IMPLEMENTED
  - FAILED_PRECONDITION
  - CAPABILITY_DENIED
  - OFFLINE
  - THERMAL_SHED
  - OBJECT_IN_USE
  - INVALID_ATTR_VALUE
  - ATTR_NOT_IMPLEMENTED
  - UNKNOWN_ATTRIBUTE
  - ATTR_NOT_SUPPORTED
  - INVALID_ATTR_ID
