# Dialect for tools/codegen/src/*.yaml.
# tools/codegen/infra/schema.py reads this file and checks types.yaml and every class file.

version: 1

file_kinds:
  types:
    holds: named scalars, enums, messages used by every class
  class:
    holds: one API class, its verbs, and its attributes

class_fields:
  class: short name, lower case, matches file stem
  singleton: true means one object per process and no key argument
  datastore: none | kv | git  (none for System)
  verbs: map of verb name to visibility and optional stream
  attrs: map of ATTR_NAME to id, type, visibility, flags, comment

verb_names:
  - create
  - get
  - set
  - delete
  - subscribe
  - unsubscribe
  - notify

visibility:
  - public    # vi header and proto
  - internal  # vii header only

attr_flags:
  - MANDATORY_ON_CREATE
  - CREATE_ONLY
  - CREATE_AND_SET
  - READ_ONLY
  - SET_ONLY
  - KEY
  - SUBSCRIBABLE

notes:
  - class_id is the function prefix, not a field on the key
  - duplicate attr ids in a call collapse to the last entry before vii
  - attr id numbers never change meaning; promoting to public keeps the number
  - flags in public headers are comments; via uses a generated metadata table
