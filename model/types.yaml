package: vedam

status:
  - name: SUCCESS
    value: 0
    comment: The call completed and any output buffers are valid.
  - name: FAILURE
    value: -1
    comment: The call failed for a reason not covered by a more specific code. Discard outputs.
  - name: NOT_SUPPORTED
    value: -2
    comment: This build or origin does not support the verb or attribute. Discard outputs.
  - name: NO_MEMORY
    value: -3
    comment: A buffer could not be allocated. Retry later or use a smaller list.
  - name: INVALID_PARAMETER
    value: -4
    comment: A pointer, count, or length is not usable. Fix the arguments and retry.
  - name: ITEM_ALREADY_EXISTS
    value: -5
    comment: Create was asked for an object that already exists.
  - name: ITEM_NOT_FOUND
    value: -6
    comment: Read, set, or delete named an object that does not exist.
  - name: BUFFER_OVERFLOW
    value: -7
    comment: A caller-supplied buffer is too small. The needed length is written when the type allows it.
  - name: MANDATORY_ATTR_MISSING
    value: -8
    comment: Create lacked an attribute that must be present. Add it and retry.
  - name: UNINITIALIZED
    value: -9
    comment: vedam_init has not completed, or vedam_deinit has already run.
  - name: NOT_IMPLEMENTED
    value: -10
    comment: The verb exists in the header but this origin or slice must not call it.
  - name: FAILED_PRECONDITION
    value: -11
    comment: The object exists but is not in a state that allows this verb.
  - name: CAPABILITY_DENIED
    value: -12
    comment: The caller is not allowed to use this verb or attribute.
  - name: OFFLINE
    value: -13
    comment: The path needs a network or peer that is not reachable.
  - name: THERMAL_SHED
    value: -14
    comment: The device is too hot or too busy. Retry after a wait.
  - name: OBJECT_IN_USE
    value: -15
    comment: Delete or set cannot proceed while another call holds the object.
  - name: INVALID_ATTR_VALUE_0
    value: -100
    comment: An attribute value is not valid. Add the zero-based index of that attribute in the list to this code.
  - name: ATTR_NOT_IMPLEMENTED_0
    value: -200
    comment: An attribute id is known but not implemented. Add the zero-based index of that attribute in the list to this code.
  - name: UNKNOWN_ATTRIBUTE_0
    value: -300
    comment: An attribute id is not defined for this class. Add the zero-based index of that attribute in the list to this code.
  - name: ATTR_NOT_SUPPORTED_0
    value: -400
    comment: The origin may not use this attribute on this verb. Add the zero-based index of that attribute in the list to this code.
  - name: INVALID_ATTR_ID_0
    value: -500
    comment: An attribute id is out of range. Add the zero-based index of that attribute in the list to this code.

classes:
  - name: SYSTEM
    id: 1
    comment: The process system object.
  - name: IDENTITY
    id: 2
    comment: Identity objects keyed by the caller object id.
  - name: STORAGE
    id: 3
    comment: Storage objects keyed by the caller object id.
  - name: SECURITY
    id: 4
    comment: The process security singleton.
  - name: CONTRACT
    id: 5
    comment: A program that decides whether a command may be logged.
  - name: PLUGIN
    id: 6
    comment: A program one node loads for itself and other nodes do not replay.

proto_status:
  - UNSPECIFIED
  - OK
  - FAILURE
  - NOT_SUPPORTED
  - NO_MEMORY
  - INVALID_PARAMETER
  - ITEM_ALREADY_EXISTS
  - ITEM_NOT_FOUND
  - BUFFER_OVERFLOW
  - MANDATORY_ATTR_MISSING
  - UNINITIALIZED
  - NOT_IMPLEMENTED
  - FAILED_PRECONDITION
  - CAPABILITY_DENIED
  - OFFLINE
  - THERMAL_SHED
  - OBJECT_IN_USE
  - INVALID_ATTR_VALUE
  - ATTR_NOT_IMPLEMENTED
  - UNKNOWN_ATTRIBUTE
  - ATTR_NOT_SUPPORTED
  - INVALID_ATTR_ID

# The closed set of value shapes. Every attribute type resolves to one kind.
kinds:
  - name: BOOL
    member: booldata
    proto_field: booldata
    proto_type: bool
    integer: false
    get_needs: none
    comment: A true or false value.
  - name: S32
    member: s32
    proto_field: s32
    proto_type: int32
    integer: true
    get_needs: none
    comment: A signed 32-bit integer. Every class enum uses this kind.
  - name: U32
    member: u32
    proto_field: u32
    proto_type: uint32
    integer: true
    get_needs: none
    comment: An unsigned 32-bit integer.
  - name: U64
    member: u64
    proto_field: u64
    proto_type: uint64
    integer: true
    get_needs: none
    comment: An unsigned 64-bit integer.
  - name: VERSION
    member: version
    proto_field: version
    proto_type: vedam.v1.Version
    integer: false
    get_needs: none
    comment: A major and minor version pair.
  - name: TEXT
    member: text
    proto_field: text
    proto_type: bytes
    integer: false
    get_needs: buffer
    comment: UTF-8 bytes with a length. On get, len is the room in buf.
  - name: STRUCT
    member: ptr
    proto_field: message
    proto_type: google.protobuf.Any
    integer: false
    get_needs: pointer
    comment: A class struct. Get writes into the struct the caller points at.
  - name: LIST
    member: list
    proto_field: list
    proto_type: vedam.v1.ListValue
    integer: false
    get_needs: buffer
    comment: Items of one type with a count. On get, count is the room in items.

builtin_types:
  vbool_t: BOOL
  vint32_t: S32
  vuint32_t: U32
  vuint64_t: U64
  v_version_t: VERSION
  v_text_t: TEXT

attr_flags:
  - name: MANDATORY_ON_CREATE
    comment: Create must include this id.
  - name: CREATE_ONLY
    comment: Only create may write this value.
  - name: CREATE_AND_SET
    comment: Create and set may write this value.
  - name: READ_ONLY
    comment: Do not send a new value.
  - name: SET_ONLY
    comment: Set may write this value.
  - name: KEY
    comment: This id is the object key. Also set Message.key.
  - name: SUBSCRIBABLE
    comment: Subscribe and Unsubscribe may name this id.

# One row per verb, in V_VERB_* order.
verbs:
  - name: create
    method: Create
    writes_values: true
    collapse: false
    checks_list: true
    public_doc: |
      Create the object from the attribute list in the message.

      A singleton sets key to NULL and key_len to 0. Every attribute marked
      mandatory on create must be in the list. When attr_count is greater than
      zero, both attr_list and status_list must be set.
  - name: get
    method: Get
    writes_values: false
    collapse: true
    checks_list: true
    public_doc: |
      Fill the values for the attribute ids in the message.

      The caller sets each id. For a state attribute the caller sets value.ptr.
      Duplicate ids keep the last entry. A singleton sets key to NULL and key_len
      to 0. When attr_count is greater than zero, both attr_list and status_list
      must be set. Each status_list entry is written; the overall return is success
      only when every entry is success.
  - name: set
    method: Set
    writes_values: true
    collapse: true
    checks_list: true
    public_doc: |
      Change the values for the attribute ids in the message.

      Duplicate ids keep the last entry. A singleton sets key to NULL and key_len
      to 0. When attr_count is greater than zero, both attr_list and status_list
      must be set.
  - name: delete
    method: Delete
    writes_values: false
    collapse: false
    checks_list: false
    public_doc: |
      Delete the object named by the key in the message.

      A singleton sets key to NULL and key_len to 0.
  - name: subscribe
    method: Subscribe
    writes_values: false
    collapse: true
    checks_list: true
    public_doc: |
      Register a watch for attributes marked subscribable. This call returns once.

      A singleton sets key to NULL and key_len to 0. When attr_count is greater
      than zero, both attr_list and status_list must be set.
  - name: unsubscribe
    method: Unsubscribe
    writes_values: false
    collapse: true
    checks_list: true
    public_doc: |
      Stop watches for the same caller. An empty list stops every watch.

      A singleton sets key to NULL and key_len to 0. When attr_count is greater
      than zero, both attr_list and status_list must be set.
  - name: notify
    method: Notify
    writes_values: true
    collapse: false
    checks_list: true
    public_doc: |
      Send changed values to the current watchers.

      A singleton sets key to NULL and key_len to 0. When attr_count is greater
      than zero, both attr_list and status_list must be set.
